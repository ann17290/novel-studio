<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สตูดิโอนักเขียน - Novel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-page: #f1f5f9;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.08);
      --editor-font-size: 20px; /* ขนาดตัวอักษรเริ่มต้นที่ใหญ่ขึ้น */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Header บาร์ด้านบน */
    header {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-weight: 700;
      font-size: 19px;
      color: var(--primary);
      text-decoration: none;
    }
    .novel-badge-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-page);
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-right: 6px;
    }
    .font-size-controls span {
      font-size: 13px;
      font-weight: 600;
      min-width: 44px;
      text-align: center;
    }

    /* ปุ่มมาตรฐาน */
    .btn {
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-sm { padding: 5px 10px; font-size: 13px; }
    .btn-icon { width: 34px; height: 34px; padding: 0; }

    /* 2. พื้นที่โครงสร้างแอป 3 ส่วน */
    .app-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* คอลัมน์ซ้าย (Sidebar) */
    aside.sidebar {
      width: 290px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.25s ease, width 0.25s ease;
    }
    aside.sidebar.collapsed {
      margin-left: -290px;
    }

    .sidebar-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }
    .sidebar-tab-btn {
      flex: 1;
      padding: 11px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .sidebar-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--surface);
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .list-item {
      padding: 11px 14px;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.1s ease;
    }
    .list-item:hover { background: #f8fafc; }
    .list-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    /* คอลัมน์กลาง: กระดาษพิมพ์งานตัวใหญ่ */
    main.main-viewport {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    /* ปุ่มลอยเปิด Sidebar เวลาถูกซ่อน */
    .toggle-floating-btn {
      position: absolute;
      top: 16px;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 5px;
    }
    .toggle-floating-btn.visible { display: inline-flex; }
    #btn-open-left { left: 16px; }
    #btn-open-right { right: 16px; }

    /* กระดาษพิมพ์ */
    .paper-canvas {
      width: 100%;
      max-width: 900px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      min-height: 85vh;
      overflow: hidden;
    }
    .chapter-header-box {
      padding: 26px 36px 16px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-title {
      font-size: 26px; /* หัวข้อใหญ่สะดุดตา */
      font-weight: 700;
      border: none;
      outline: none;
      width: 100%;
      color: var(--text-main);
    }
    .input-goal {
      font-size: 15px;
      color: var(--text-muted);
      border: none;
      outline: none;
      width: 100%;
    }
    .writing-editor {
      flex: 1;
      padding: 36px;
      border: none;
      outline: none;
      resize: none;
      font-size: var(--editor-font-size); /* ตัวหนังสือใหญ่ขึ้นตามขนาดที่ปรับ */
      line-height: 2.1;
      color: #1e293b;
      font-family: inherit;
    }

    /* คอลัมน์ขวา: ผู้ช่วยตรวจงาน */
    aside.assistant-drawer {
      width: 330px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-right 0.25s ease, width 0.25s ease;
    }
    aside.assistant-drawer.collapsed {
      margin-right: -330px;
    }

    .drawer-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .metric-card {
      background: var(--bg-page);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .metric-val { font-size: 18px; font-weight: 700; color: var(--primary); }
    .metric-lbl { font-size: 12px; color: var(--text-muted); }

    .check-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-left: 3px solid var(--primary);
    }
    .check-card.err { border-left-color: var(--danger); }
    .check-card.warn { border-left-color: var(--warning); }

    /* โมดัลรูปเล่ม */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(2px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #334155;
      width: 90vw;
      height: 90vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      background: #0f172a;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .print-page {
      background: #fff;
      width: 148mm;
      min-height: 210mm;
      padding: 24mm 20mm;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      font-size: 13pt;
      line-height: 1.8;
      color: #111;
    }

    @media print {
      body * { visibility: hidden; }
      .modal-scroll, .modal-scroll * { visibility: visible; }
      .modal-scroll { position: absolute; left: 0; top: 0; padding: 0; background: transparent; }
      .print-page { box-shadow: none; page-break-before: always; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- 1. บาร์ด้านบน -->
  <header>
    <div class="brand-section">
      <button class="btn btn-icon btn-sm" title="ซ่อน/แสดงเมนูซ้าย" onclick="toggleLeftSidebar()">☰</button>
      <a href="#" class="brand-logo">📚 WriterHub</a>
      <span class="novel-badge-title" id="top-novel-title">ใต้เงาจันทรา</span>
    </div>

    <div class="header-actions">
      <!-- ปรับขนาดตัวอักษร -->
      <div class="font-size-controls" title="ปรับขนาดตัวอักษรเนื้อหา">
        <button class="btn btn-sm btn-icon" onclick="changeFontSize(-2)">A-</button>
        <span id="font-size-display">20px</span>
        <button class="btn btn-sm btn-icon" onclick="changeFontSize(2)">A+</button>
      </div>

      <button class="btn btn-sm" id="btn-focus-mode" onclick="toggleFocusMode()">🎯 โฟกัสเต็มจอ</button>
      <button class="btn btn-primary btn-sm" onclick="openBookModal()">📖 แสดงรูปเล่ม</button>
      <button class="btn btn-icon btn-sm" title="ซ่อน/แสดงแถบผู้ช่วยขวา" onclick="toggleRightDrawer()">⚙️</button>
    </div>
  </header>

  <!-- 2. พื้นที่ทำงาน 3 คอลัมน์ -->
  <div class="app-layout">
    
    <!-- ปุ่มลอยดึงแถบกลับมาเวลาซ่อน -->
    <button class="toggle-floating-btn" id="btn-open-left" onclick="toggleLeftSidebar()">▶ สารบัญบท</button>
    <button class="toggle-floating-btn" id="btn-open-right" onclick="toggleRightDrawer()">◀ ตัวช่วยวิเคราะห์</button>

    <!-- ฝั่งซ้าย: สารบัญ/ตัวละคร/โครงเรื่อง -->
    <aside class="sidebar" id="left-sidebar">
      <div class="sidebar-header">
        <span style="font-weight:600; font-size:14px;">โครงสร้างนิยาย</span>
        <button class="btn btn-sm" style="border:none; color:var(--text-muted);" onclick="toggleLeftSidebar()">✕ ซ่อน</button>
      </div>
      <div class="sidebar-tabs">
        <button class="sidebar-tab-btn active" onclick="switchNav('chapters', this)">บทนิยาย</button>
        <button class="sidebar-tab-btn" onclick="switchNav('characters', this)">ตัวละคร</button>
        <button class="sidebar-tab-btn" onclick="switchNav('outline', this)">โครงเรื่อง</button>
      </div>

      <div class="sidebar-content" id="sidebar-chapters">
        <button class="btn btn-primary" style="width: 100%; margin-bottom: 12px; justify-content: center;" onclick="addChapter()">+ เพิ่มบทใหม่</button>
        <div id="chapter-list"></div>
      </div>

      <div class="sidebar-content" id="sidebar-characters" style="display: none;">
        <button class="btn btn-primary" style="width: 100%; margin-bottom: 12px; justify-content: center;" onclick="addCharacter()">+ เพิ่มตัวละคร</button>
        <div id="char-list"></div>
      </div>

      <div class="sidebar-content" id="sidebar-outline" style="display: none; display: flex; flex-direction: column; gap: 14px;">
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">ชื่อเรื่อง</label>
        <input type="text" id="meta-title" style="padding:10px; font-size:15px;" oninput="saveMeta()">
        
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">นามปากกา</label>
        <input type="text" id="meta-author" style="padding:10px; font-size:15px;" oninput="saveMeta()">
        
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">คำนำนักเขียน</label>
        <textarea rows="4" id="meta-foreword" style="padding:10px; font-size:14px; line-height:1.6;" oninput="saveMeta()"></textarea>

        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">เรื่องย่อ (Synopsis)</label>
        <textarea rows="6" id="meta-synopsis" style="padding:10px; font-size:14px; line-height:1.6;" oninput="saveMeta()"></textarea>
      </div>
    </aside>

    <!-- ฝั่งกลาง: พื้นที่เขียนกระดาษตัวใหญ่ -->
    <main class="main-viewport">
      <div class="paper-canvas" id="editor-workspace">
        <div class="chapter-header-box">
          <input type="text" id="current-ch-title" class="input-title" placeholder="ชื่อบท..." oninput="handleTextChange()">
          <input type="text" id="current-ch-goal" class="input-goal" placeholder="เป้าหมายของบทนี้..." oninput="handleTextChange()">
        </div>
        <textarea id="current-ch-text" class="writing-editor" placeholder="เริ่มเขียนบรรทัดแรกที่นี่..." oninput="handleTextChange()"></textarea>
      </div>

      <!-- ฟอร์มตัวละคร -->
      <div class="paper-canvas" id="character-workspace" style="display: none; padding: 36px; gap: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 style="font-size: 20px;">โปรไฟล์ตัวละคร</h2>
          <button class="btn btn-sm" style="color:var(--danger); border-color:var(--danger);" onclick="deleteCharacter()">ลบตัวละครนี้</button>
        </div>
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">ชื่อตัวละคร</label>
        <input type="text" id="char-name" style="padding:10px; font-size:16px;" oninput="saveActiveChar()">
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">บทบาท</label>
        <input type="text" id="char-role" style="padding:10px; font-size:15px;" oninput="saveActiveChar()">
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">เป้าหมาย / แรงจูงใจ (Goal)</label>
        <input type="text" id="char-goal" style="padding:10px; font-size:15px;" oninput="saveActiveChar()">
        <label style="font-size:13px; font-weight:600; color:var(--text-muted);">อุปนิสัยและลักษณะเด่น</label>
        <textarea rows="5" id="char-personality" style="padding:10px; font-size:15px; line-height:1.6;" oninput="saveActiveChar()"></textarea>
      </div>
    </main>

    <!-- ฝั่งขวา: เครื่องมือช่วยตรวจ -->
    <aside class="assistant-drawer" id="right-drawer">
      <div class="drawer-header">
        <span>เครื่องมือช่วยเขียน & วิเคราะห์</span>
        <button class="btn btn-sm" style="border:none; color:var(--text-muted);" onclick="toggleRightDrawer()">✕ ซ่อน</button>
      </div>
      <div class="drawer-body">
        
        <div>
          <div style="font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:8px;">สถิติบทปัจจุบัน</div>
          <div class="metric-grid">
            <div class="metric-card"><div class="metric-val" id="metric-chars">0</div><div class="metric-lbl">อักขระ (ไม่รวมเว้นวรรค)</div></div>
            <div class="metric-card"><div class="metric-val" id="metric-words">0</div><div class="metric-lbl">จำนวนคำ</div></div>
            <div class="metric-card"><div class="metric-val" id="metric-read">0 น.</div><div class="metric-lbl">เวลาอ่านประมาณ</div></div>
            <div class="metric-card"><div class="metric-val" id="metric-lines">0</div><div class="metric-lbl">จำนวนบรรทัด</div></div>
          </div>
        </div>

        <div>
          <div style="font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:8px;">พิสูจน์อักษร / คำมักผิด (<span id="typo-count">0</span>)</div>
          <div id="typo-results" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>

        <div>
          <div style="font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:8px;">ตรวจจับสำนวนสไตล์ AI (<span id="ai-count">0</span>)</div>
          <div id="ai-results" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>

      </div>
    </aside>

  </div>

  <!-- โมดัลดูรูปเล่มหนังสือ -->
  <div class="modal-overlay" id="book-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span style="font-weight:600;">📖 ตัวอย่างรูปเล่มหนังสือพร้อมสั่งพิมพ์</span>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ สั่งพิมพ์ / บันทึก PDF</button>
          <button class="btn btn-sm" onclick="closeBookModal()">ปิด</button>
        </div>
      </div>
      <div class="modal-scroll" id="book-print-container"></div>
    </div>
  </div>

  <script>
    let currentFontSize = 20; // ขนาดเริ่มต้น 20px

    function changeFontSize(delta) {
      currentFontSize = Math.max(14, Math.min(32, currentFontSize + delta));
      document.documentElement.style.setProperty('--editor-font-size', `${currentFontSize}px`);
      document.getElementById('font-size-display').textContent = `${currentFontSize}px`;
    }

    // ฟังก์ชันซ่อน/เปิดแถบซ้าย-ขวา
    function toggleLeftSidebar() {
      const sb = document.getElementById('left-sidebar');
      const btn = document.getElementById('btn-open-left');
      sb.classList.toggle('collapsed');
      btn.classList.toggle('visible', sb.classList.contains('collapsed'));
    }

    function toggleRightDrawer() {
      const drawer = document.getElementById('right-drawer');
      const btn = document.getElementById('btn-open-right');
      drawer.classList.toggle('collapsed');
      btn.classList.toggle('visible', drawer.classList.contains('collapsed'));
    }

    // โหมดโฟกัสเต็มจอ (ซ่อนทั้งซ้ายและขวา)
    let isFocusMode = false;
    function toggleFocusMode() {
      const sb = document.getElementById('left-sidebar');
      const drawer = document.getElementById('right-drawer');
      const btnLeft = document.getElementById('btn-open-left');
      const btnRight = document.getElementById('btn-open-right');
      const focusBtn = document.getElementById('btn-focus-mode');

      isFocusMode = !isFocusMode;
      if (isFocusMode) {
        sb.classList.add('collapsed');
        drawer.classList.add('collapsed');
        btnLeft.classList.add('visible');
        btnRight.classList.add('visible');
        focusBtn.textContent = '❌ ออกจากโหมดโฟกัส';
        focusBtn.classList.add('btn-primary');
      } else {
        sb.classList.remove('collapsed');
        drawer.classList.remove('collapsed');
        btnLeft.classList.remove('visible');
        btnRight.classList.remove('visible');
        focusBtn.textContent = '🎯 โฟกัสเต็มจอ';
        focusBtn.classList.remove('btn-primary');
      }
    }

    const TYPOS = [
      { wrong: "นะค่ะ", right: "นะคะ" },
      { wrong: "อนุญาติ", right: "อนุญาต" },
      { wrong: "ลายเซ็นต์", right: "ลายเซ็น" },
      { wrong: "ผูกพันธ์", right: "ผูกพัน" },
      { wrong: "สังเกตุ", right: "สังเกต" }
    ];

    const AI_STYLES = [
      { regex: /ถูก(.{1,10})โดย/g, text: "ถูก...โดย... (Passive แปลตรงตัว)" },
      { regex: /มันเป็นเรื่องที่/g, text: "มันเป็นเรื่องที่... (คำเชื่อมฟุ่มเฟือย)" },
      { regex: /ในความเป็นจริงแล้ว/g, text: "ในความเป็นจริงแล้ว (สำนวนติดปาก AI)" }
    ];

    let store = JSON.parse(localStorage.getItem('novel_web_data')) || {
      meta: { title: "ใต้เงาจันทรา", author: "กวินทร์", foreword: "แด่ผู้อ่านทุกท่านที่รักการเดินทางในโลกจินตนาการ", synopsis: "เรื่องราวการไขความลับในเมืองเก่า..." },
      characters: [
        { id: 1, name: "ธีร์", role: "ตัวเอก", goal: "กอบกู้ชื่อเสียงตระกูล", personality: "สุขุม เงียบขรึม" }
      ],
      chapters: [
        { id: 1, title: "บทนำ: แสงแรกแห่งรุ่งอรุณ", goal: "แนะนำตัวละครหลักและบรรยากาศ", text: "สายหมอกหนาทึบยังคงปกคลุมไปทั่วทั้งหุบเขา ธีร์ก้าวข้ามผ่านประตูรั้วเก่าแก่ด้วยความระมัดระวัง เขาไม่ได้รับอนุญาตให้เข้ามาที่นี่ แต่เวลาเหลือน้อยเต็มทีแล้ว นะค่ะ" }
      ]
    };

    let activeChapterId = store.chapters[0]?.id || null;
    let activeCharId = store.characters[0]?.id || null;

    function saveStore() {
      localStorage.setItem('novel_web_data', JSON.stringify(store));
    }

    function switchNav(tab, btn) {
      document.querySelectorAll('.sidebar-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('sidebar-chapters').style.display = tab === 'chapters' ? 'block' : 'none';
      document.getElementById('sidebar-characters').style.display = tab === 'characters' ? 'block' : 'none';
      document.getElementById('sidebar-outline').style.display = tab === 'outline' ? 'flex' : 'none';

      const editor = document.getElementById('editor-workspace');
      const charSpace = document.getElementById('character-workspace');
      if (tab === 'characters') {
        editor.style.display = 'none';
        charSpace.style.display = 'flex';
        renderCharList();
      } else {
        editor.style.display = 'flex';
        charSpace.style.display = 'none';
      }
    }

    function renderChapterList() {
      const container = document.getElementById('chapter-list');
      container.innerHTML = '';
      store.chapters.forEach((ch, idx) => {
        const item = document.createElement('div');
        item.className = `list-item ${ch.id === activeChapterId ? 'active' : ''}`;
        item.innerHTML = `<span>ตอนที่ ${idx + 1}: ${ch.title || 'ไม่มีชื่อตอน'}</span>`;
        item.onclick = () => selectChapter(ch.id);
        container.appendChild(item);
      });
      loadActiveChapter();
    }

    function selectChapter(id) {
      activeChapterId = id;
      renderChapterList();
    }

    function loadActiveChapter() {
      const ch = store.chapters.find(c => c.id === activeChapterId);
      if (!ch) return;
      document.getElementById('current-ch-title').value = ch.title;
      document.getElementById('current-ch-goal').value = ch.goal;
      document.getElementById('current-ch-text').value = ch.text;
      runAnalysis();
    }

    function handleTextChange() {
      const ch = store.chapters.find(c => c.id === activeChapterId);
      if (ch) {
        ch.title = document.getElementById('current-ch-title').value;
        ch.goal = document.getElementById('current-ch-goal').value;
        ch.text = document.getElementById('current-ch-text').value;
        saveStore();
        renderChapterList();
        runAnalysis();
      }
    }

    function addChapter() {
      const newCh = { id: Date.now(), title: `ตอนที่ ${store.chapters.length + 1}`, goal: "", text: "" };
      store.chapters.push(newCh);
      activeChapterId = newCh.id;
      renderChapterList();
      saveStore();
    }

    function renderCharList() {
      const container = document.getElementById('char-list');
      container.innerHTML = '';
      store.characters.forEach(c => {
        const item = document.createElement('div');
        item.className = `list-item ${c.id === activeCharId ? 'active' : ''}`;
        item.innerHTML = `<span>${c.name || 'ไม่มีชื่อ'} (${c.role || 'บทบาท'})</span>`;
        item.onclick = () => selectChar(c.id);
        container.appendChild(item);
      });
      loadActiveChar();
    }

    function selectChar(id) {
      activeCharId = id;
      renderCharList();
    }

    function loadActiveChar() {
      const c = store.characters.find(item => item.id === activeCharId);
      if (!c) return;
      document.getElementById('char-name').value = c.name;
      document.getElementById('char-role').value = c.role;
      document.getElementById('char-goal').value = c.goal;
      document.getElementById('char-personality').value = c.personality;
    }

    function saveActiveChar() {
      const c = store.characters.find(item => item.id === activeCharId);
      if (c) {
        c.name = document.getElementById('char-name').value;
        c.role = document.getElementById('char-role').value;
        c.goal = document.getElementById('char-goal').value;
        c.personality = document.getElementById('char-personality').value;
        saveStore();
        renderCharList();
      }
    }

    function addCharacter() {
      const newC = { id: Date.now(), name: "ตัวละครใหม่", role: "", goal: "", personality: "" };
      store.characters.push(newC);
      activeCharId = newC.id;
      renderCharList();
      saveStore();
    }

    function deleteCharacter() {
      if (confirm('ยืนยันลบตัวละครนี้หรือไม่?')) {
        store.characters = store.characters.filter(c => c.id !== activeCharId);
        activeCharId = store.characters[0]?.id || null;
        renderCharList();
        saveStore();
      }
    }

    function loadMeta() {
      document.getElementById('meta-title').value = store.meta.title;
      document.getElementById('meta-author').value = store.meta.author;
      document.getElementById('meta-foreword').value = store.meta.foreword;
      document.getElementById('meta-synopsis').value = store.meta.synopsis;
      document.getElementById('top-novel-title').textContent = store.meta.title || 'ไม่มีชื่อเรื่อง';
    }

    function saveMeta() {
      store.meta.title = document.getElementById('meta-title').value;
      store.meta.author = document.getElementById('meta-author').value;
      store.meta.foreword = document.getElementById('meta-foreword').value;
      store.meta.synopsis = document.getElementById('meta-synopsis').value;
      document.getElementById('top-novel-title').textContent = store.meta.title || 'ไม่มีชื่อเรื่อง';
      saveStore();
    }

    function runAnalysis() {
      const text = document.getElementById('current-ch-text').value;
      const charsNoSpace = text.replace(/\s+/g, '').length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const lines = text.split('\n').length;
      const readMin = Math.ceil(charsNoSpace / 1000) || 1;

      document.getElementById('metric-chars').textContent = charsNoSpace.toLocaleString();
      document.getElementById('metric-words').textContent = words.toLocaleString();
      document.getElementById('metric-lines').textContent = lines.toLocaleString();
      document.getElementById('metric-read').textContent = (charsNoSpace > 0 ? readMin : 0) + ' น.';

      const typoBox = document.getElementById('typo-results');
      typoBox.innerHTML = '';
      let typoCount = 0;
      TYPOS.forEach(t => {
        if (text.includes(t.wrong)) {
          typoCount++;
          const card = document.createElement('div');
          card.className = 'check-card err';
          card.innerHTML = `
            <div>พบคำผิด: <strong>${t.wrong}</strong> &rarr; <strong style="color:var(--success);">${t.right}</strong></div>
            <button class="btn btn-sm" style="align-self:flex-start;" onclick="fixTypo('${t.wrong}', '${t.right}')">แก้ทันที</button>
          `;
          typoBox.appendChild(card);
        }
      });
      document.getElementById('typo-count').textContent = typoCount;
      if (typoCount === 0) typoBox.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">ไม่พบคำผิด</div>';

      const aiBox = document.getElementById('ai-results');
      aiBox.innerHTML = '';
      let aiCount = 0;
      AI_STYLES.forEach(ai => {
        const matches = text.match(ai.regex);
        if (matches) {
          aiCount += matches.length;
          const card = document.createElement('div');
          card.className = 'check-card warn';
          card.innerHTML = `<div>สำนวนคล้าย AI: <strong>${matches[0]}</strong></div><div style="font-size:11px;color:var(--text-muted);">${ai.text}</div>`;
          aiBox.appendChild(card);
        }
      });
      document.getElementById('ai-count').textContent = aiCount;
      if (aiCount === 0) aiBox.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">สำนวนเป็นธรรมชาติ</div>';
    }

    function fixTypo(wrong, right) {
      const textarea = document.getElementById('current-ch-text');
      textarea.value = textarea.value.replace(new RegExp(wrong, 'g'), right);
      handleTextChange();
    }

    function openBookModal() {
      const container = document.getElementById('book-print-container');
      container.innerHTML = '';

      const cover = document.createElement('div');
      cover.className = 'print-page';
      cover.style.display = 'flex';
      cover.style.flexDirection = 'column';
      cover.style.justifyContent = 'center';
      cover.style.alignItems = 'center';
      cover.style.textAlign = 'center';
      cover.innerHTML = `
        <h1 style="font-size: 26pt; margin-bottom: 20px;">${store.meta.title}</h1>
        <p style="font-size: 15pt; color:#475569;">โดย ${store.meta.author}</p>
      `;
      container.appendChild(cover);

      const foreword = document.createElement('div');
      foreword.className = 'print-page';
      foreword.innerHTML = `
        <h2 style="text-align:center; font-size:18pt; margin-bottom:30px;">คำนำ</h2>
        <p style="text-indent: 1.5cm; text-align:justify;">${store.meta.foreword.replace(/\n/g, '<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')}</p>
        <p style="text-align:right; margin-top:40px;">— ${store.meta.author}</p>
      `;
      container.appendChild(foreword);

      const toc = document.createElement('div');
      toc.className = 'print-page';
      let tocHtml = `<h2 style="text-align:center; font-size:18pt; margin-bottom:30px;">สารบัญ</h2>`;
      store.chapters.forEach((ch, i) => {
        tocHtml += `
          <div style="display:flex; justify-content:space-between; border-bottom:1px dotted #ccc; padding:6px 0;">
            <span>บทที่ ${i + 1}: ${ch.title}</span>
            <span>บทที่ ${i + 1}</span>
          </div>`;
      });
      toc.innerHTML = tocHtml;
      container.appendChild(toc);

      store.chapters.forEach((ch, i) => {
        const page = document.createElement('div');
        page.className = 'print-page';
        const pars = ch.text.split('\n\n').filter(p => p.trim() !== '');
        let pHtml = `<h2 style="text-align:center; font-size:18pt; margin-bottom:25px;">${ch.title}</h2>`;
        pars.forEach(p => {
          pHtml += `<p style="text-indent: 1.5cm; margin-bottom: 10px; text-align:justify;">${p.replace(/\n/g, '<br>')}</p>`;
        });
        page.innerHTML = pHtml;
        container.appendChild(page);
      });

      document.getElementById('book-modal').style.display = 'flex';
    }

    function closeBookModal() {
      document.getElementById('book-modal').style.display = 'none';
    }

    loadMeta();
    renderChapterList();
  </script>
</body>
</html>
